name: Hoseo Network Diagnose

# 로그인/출결 조회 요청이 HTTP 직접 호출(A안)로 대체 가능한지 판단하기 위한
# 일회성 진단 워크플로. 실제 스크래핑을 수행하지 않고 요청/응답만 관찰한다.
on:
  workflow_dispatch:
    inputs:
      report_url:
        description: 'Attendance report URL'
        required: false
        default: 'https://learn.hoseo.ac.kr/local/ubonattend/report.php?id=40069'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run network diagnose
        env:
          HOSEO_USERNAME: ${{ secrets.HOSEO_USERNAME }}
          HOSEO_PASSWORD: ${{ secrets.HOSEO_PASSWORD }}
          ATTENDANCE_URL: ${{ github.event.inputs.report_url }}
        run: python scripts/hoseo_network_diagnose.py
