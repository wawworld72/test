name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JS dependencies
        run: npm ci

      - name: Run JS tests (gas/attendanceCore.js)
        run: npm test

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Python tests
        run: cd scripts && python -m unittest discover -p "test_*.py" -v
