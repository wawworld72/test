name: IBK Campus Attendance Scrape

# 수동 트리거 전용 (workflow_dispatch만). 은행 계열 시스템 특성상 이상거래탐지(FDS)
# 위험을 먼저 확인하기 전까지는 schedule을 추가하지 않는다.
on:
  workflow_dispatch:
    inputs:
      semester:
        description: '년도/학기 (예: 2026년도 1학기). 비워두면 화면 기본값 사용'
        required: false
        default: ''
      course_name:
        description: '조회할 교과목명 (필수)'
        required: true
      section:
        description: '분반 (예: 01). 같은 과목에 여러 분반이 있을 때만 지정'
        required: false
        default: ''

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run scraper
        env:
          IBK_CAMPUS_USER: ${{ secrets.IBK_CAMPUS_USER }}
          IBK_CAMPUS_PASS: ${{ secrets.IBK_CAMPUS_PASS }}
          IBK_SEMESTER: ${{ github.event.inputs.semester }}
          IBK_COURSE_NAME: ${{ github.event.inputs.course_name }}
          IBK_SECTION: ${{ github.event.inputs.section }}
        run: python scripts/ibk_attendance_scraper.py

      - name: Upload output artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ibk-attendance-output
          path: ibk_attendance_output/
          retention-days: 14
